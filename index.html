<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Български новини</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{height:265px;background:#111b2e;border-bottom:1px solid #26344b;display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;gap:20px}
h1{font-size:34px;margin:0;font-weight:750}
.flag{font-size:32px;margin-right:10px}
.clock{text-align:right}
#time{font-size:36px;font-weight:750}
#date{font-size:18px;color:#b9c1cf;margin-top:5px}
main{padding:25px 2.2% 50px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}
section h2{color:#9bc5ff;font-size:25px;margin:0 0 14px 2px}
.panel{background:#111b2e;border-radius:12px;padding:18px;min-height:150px}
.status{color:#b8c1cf;font-size:17px;padding:8px}
.cards{display:grid;gap:14px}
.card{display:flex;gap:15px;background:#18243a;border-radius:11px;padding:12px;text-decoration:none;color:inherit;transition:.15s}
.card:hover{background:#21314c}
.thumb{width:145px;height:92px;border-radius:8px;object-fit:cover;background:#0b1423;flex:none}
.card h3{font-size:18px;line-height:1.28;margin:2px 0 7px}
.meta{font-size:13px;color:#9faabe}
@media(max-width:850px){
 header{height:150px;padding:0 18px}
 h1{font-size:25px}.flag{font-size:25px}
 #time{font-size:27px}#date{font-size:14px}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1><span class="flag">🇧🇬</span>Български новини</h1>
  <div class="clock">
    <div id="time">--:--</div>
    <div id="date">--</div>
  </div>
</header>

<main>
  <div class="grid">
    <section>
      <h2>📰 Последни новини</h2>
      <div class="panel"><div id="news" class="status">Зареждане на новините...</div></div>
    </section>
    <section>
      <h2>⚽ Спорт</h2>
      <div class="panel"><div id="sport" class="status">Зареждане на спортните новини...</div></div>
    </section>
  </div>
</main>

<script>
const API = "https://news-dashboard2.iilievwork.workers.dev";

function escapeHTML(s){
  return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function card(item){
  const img = item.image || "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=70";
  return `<a class="card" href="${escapeHTML(item.link)}" target="_blank" rel="noopener">
    <img class="thumb" src="${escapeHTML(img)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=70'">
    <div>
      <h3>${escapeHTML(item.title)}</h3>
      <div class="meta">${escapeHTML(item.source || "")}${item.pubDate ? " • "+escapeHTML(item.pubDate) : ""}</div>
    </div>
  </a>`;
}

async function load(type, el, emptyText){
  try{
    const r = await fetch(`${API}/api/news?type=${type}&_=${Date.now()}`, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    if(!Array.isArray(data.items) || !data.items.length) throw new Error("Няма новини");
    el.innerHTML = `<div class="cards">${data.items.map(card).join("")}</div>`;
  }catch(e){
    console.error(type,e);
    el.innerHTML = `<div class="status">${emptyText}<br><small>Опитай с опресняване след няколко секунди.</small></div>`;
  }
}

function clock(){
  const d=new Date();
  document.getElementById("time").textContent=d.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("date").textContent=d.toLocaleDateString("bg-BG",{weekday:"long",day:"numeric",month:"long"});
}
clock(); setInterval(clock,1000);

async function refresh(){
  await Promise.all([
    load("news",document.getElementById("news"),"Новините не могат да бъдат заредени."),
    load("sport",document.getElementById("sport"),"Спортните новини не могат да бъдат заредени.")
  ]);
}
refresh();
setInterval(refresh,5*60*1000);
</script>
</body>
</html>
